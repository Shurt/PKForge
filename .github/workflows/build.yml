name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore PKForge.sln
      - name: Test
        run: |
          dotnet test tests/PKForge.Domain.Tests/PKForge.Domain.Tests.csproj --no-restore --configuration Release
          dotnet test tests/PKForge.Engine.Tests/PKForge.Engine.Tests.csproj --no-restore --configuration Release
      - name: Build diagnostic APK
        run: |
          dotnet build src/PKForge.App/PKForge.App.csproj --no-restore \
            --configuration Debug \
            --framework net10.0-android \
            -p:DiagnosticBuild=true \
            -p:RuntimeIdentifier=android-arm64 \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=false
      - name: Locate diagnostic APK
        id: apk
        shell: bash
        run: |
          mapfile -t apks < <(find src/PKForge.App/bin/Debug/net10.0-android/android-arm64 \
            -type f -name '*-Signed.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected one signed diagnostic APK, found ${#apks[@]}." >&2
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: pkforge-diagnostic-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 3
